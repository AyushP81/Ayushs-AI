<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ayush's AI 🤖</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Intro -->
  <div id="intro">
    <img src="photo2.png" alt="Ayush's AI Logo" class="intro-logo" />
  </div>

  <!-- Auth Container -->
  <div id="auth-container" class="auth-container" style="display:none;">
    <div class="auth-card">
      <h1>Welcome to Ayush’s AI</h1>
      <p id="auth-message"></p>

      <div id="signup-form" class="auth-form">
        <input type="text" id="signup-username" placeholder="Username" />
        <input type="email" id="signup-email" placeholder="Email" />
        <input type="password" id="signup-password" placeholder="Password" />
        <button onclick="signup()">Sign Up</button>
        <p class="switch-text">Already have an account? <a href="#" onclick="toggleForms()">Log In</a></p>
      </div>

      <div id="login-form" class="auth-form" style="display:none;">
        <input type="text" id="login-username" placeholder="Username" />
        <input type="password" id="login-password" placeholder="Password" />
        <button onclick="login()">Log In</button>
        <p class="switch-text">Don't have an account? <a href="#" onclick="toggleForms()">Sign Up</a></p>
      </div>
    </div>
  </div>

  <!-- Main Chat -->
  <div id="main-content" class="container" style="display:none;">
    <h1 class="title">Ayush’s AI 🤖</h1>
    <p class="subtitle">Type a message to chat below.</p>

    <div id="chatBox" class="chat-box"></div>

    <textarea id="userInput" placeholder="Type here..." 
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
    <button id="send-btn" class="send-btn">Send</button>

    <div class="about">
      <h2>About Me</h2>
      <p>I'm Ayush Padaruth, a tech enthusiast who enjoys building AI projects and learning programming.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
