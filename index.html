<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayush's AI 🤖</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Auth Container -->
  <div id="auth-container" class="auth-container">
    <h1>Ayush's AI</h1>

    <!-- Sign Up Form -->
    <div id="signup-form" class="form">
      <h2>Sign Up</h2>
      <input type="text" id="signup-username" placeholder="Username">
      <input type="email" id="signup-email" placeholder="Email">
      <input type="password" id="signup-password" placeholder="Password">
      <button onclick="signup()">Sign Up</button>
    </div>

    <!-- Login Form -->
    <div id="login-form" class="form" style="display:none;">
      <h2>Login</h2>
      <input type="text" id="login-username" placeholder="Username">
      <input type="password" id="login-password" placeholder="Password">
      <button onclick="login()">Login</button>
    </div>

    <p id="auth-message" class="auth-message"></p>
  </div>

  <!-- Main Chat Container -->
  <div id="main-content" class="container" style="display: none;">
    <h1 class="title">Welcome to Ayush's AI 🤖</h1>
    <div id="chatBox" class="chat-box"></div>
    <textarea id="userInput" placeholder="Type your message..." 
      onkeydown="if(event.key === 'Enter' && !event.shiftKey){event.preventDefault(); sendMessage();}"></textarea>
    <button id="send-btn" class="play">Send</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
